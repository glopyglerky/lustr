name: Mixed performance evidence

on:
  pull_request:
    paths:
      - 'README.md'
      - 'PERFORMANCE.md'
      - 'performance/**'
      - 'tools/*mixed-performance*'
      - 'tools/*benchmark-host*'
      - 'tools/*mixed-profile*'
      - 'tools/*mixed-symbol*'
      - 'tools/profile-mixed-compiler.py'
      - '.github/workflows/mixed-performance-report.yml'
  push:
    branches: [next]
    paths:
      - 'README.md'
      - 'PERFORMANCE.md'
      - 'performance/**'
      - 'tools/*mixed-performance*'
      - 'tools/*benchmark-host*'
      - 'tools/*mixed-profile*'
      - 'tools/*mixed-symbol*'
      - 'tools/profile-mixed-compiler.py'
      - '.github/workflows/mixed-performance-report.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-source:
    name: Runner source provenance
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Record original workflow and source
        uses: actions/github-script@v7
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const receipt = {
              schema: 1,
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: String(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event_name: context.eventName,
              sha: context.sha,
              ref: context.ref,
              workflow_sha: process.env.WORKFLOW_SHA,
              workflow_ref: process.env.WORKFLOW_REF,
              actor: context.actor,
              triggering_actor: process.env.TRIGGERING_ACTOR,
              pull_request: pr ? {
                number: pr.number,
                head_sha: pr.head.sha,
                base_sha: pr.base.sha,
                head_repository_id: String(pr.head.repo.id),
                base_repository_id: String(pr.base.repo.id),
              } : null,
            };
            const encoded = JSON.stringify(receipt);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-source.json', encoded);
            core.notice(encoded, {title: 'runner-source-v1'});
      - name: Retain original source receipt
        uses: actions/upload-artifact@v4
        with:
          name: runner-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-source.json
          if-no-files-found: error
          retention-days: 14

  reporting:
    name: Reporting tests and committed timing replay (not compiler qualification)
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Exercise strict evidence validation with synthetic regressions
        run: |
          set -o pipefail
          python3 tools/test-mixed-performance-report.py 2>&1 | tee "$RUNNER_TEMP/reporting-tests.log"
          python3 tools/test-benchmark-host.py 2>&1 | tee "$RUNNER_TEMP/host-record-tests.log"
          python3 tools/test-mixed-profile.py 2>&1 | tee "$RUNNER_TEMP/profile-record-tests.log"
          python3 tools/test-mixed-symbol-measurement.py 2>&1 | tee "$RUNNER_TEMP/symbol-measurement-tests.log"
          python3 tools/replay-mixed-symbol-measurement.py performance/components/2026-11-17-symbol-check 2>&1 | tee "$RUNNER_TEMP/symbol-measurement-replay.log"
      - name: Replay all committed timing values and compare exact tables
        run: |
          set -o pipefail
          python3 tools/check-mixed-performance-tables.py 2>&1 | tee "$RUNNER_TEMP/committed-timing-replay.log"
      - name: Verify archived original logs and replay their exact published tables
        run: |
          set -o pipefail
          python3 tools/check-mixed-performance-archives.py 2>&1 | tee "$RUNNER_TEMP/archived-evidence-replay.log"
      - name: Reproduce the separately labeled profile diagnosis and reject corrupt evidence
        run: |
          set -o pipefail
          python3 performance/profiles/2026-11-17-40d2ac3/replay.py 2>&1 | tee "$RUNNER_TEMP/profile-reconstruction-replay.log"
          python3 performance/profiles/2026-11-17-40d2ac3/test-replay.py 2>&1 | tee "$RUNNER_TEMP/profile-reconstruction-tests.log"
      - name: Publish measured tables without granting speed or compiler admission
        run: |
          printf '%s\n\n' '# Historical paired evidence replay' 'These reporting checks do not execute a compiler or qualify current-head performance.' >> "$GITHUB_STEP_SUMMARY"
          python3 - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json
          from pathlib import Path
          manifest = json.loads(Path('performance/campaigns.json').read_text())
          for campaign in manifest['campaigns']:
              print(Path(campaign['table']).read_text())
          PY
      - name: Preserve reporting checks and exact committed data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mixed-performance-report-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/reporting-tests.log
            ${{ runner.temp }}/committed-timing-replay.log
            ${{ runner.temp }}/archived-evidence-replay.log
            ${{ runner.temp }}/host-record-tests.log
            ${{ runner.temp }}/profile-record-tests.log
            ${{ runner.temp }}/symbol-measurement-tests.log
            ${{ runner.temp }}/symbol-measurement-replay.log
            ${{ runner.temp }}/profile-reconstruction-replay.log
            ${{ runner.temp }}/profile-reconstruction-tests.log
            performance
            PERFORMANCE.md
