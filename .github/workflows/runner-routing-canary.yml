name: Runner routing canary

on:
  pull_request:
    paths:
      - .github/workflows/runner-routing-canary.yml
  workflow_dispatch:
    inputs:
      platform:
        description: Standard runner platform to qualify
        type: choice
        options: [macos-26, ubuntu-24.04, windows-latest]
        default: macos-26
      expected_environment:
        description: Expected execution environment for this attempt
        type: choice
        options: [any, github-hosted, self-hosted]
        default: any
      fail_first_attempt:
        description: Produce a controlled failure after recording source and platform
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: runner-routing-canary-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  runner-source:
    name: Runner source provenance
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Record original workflow and source
        uses: actions/github-script@v7
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const receipt = {
              schema: 1,
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: String(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event_name: context.eventName,
              sha: context.sha,
              ref: context.ref,
              workflow_sha: process.env.WORKFLOW_SHA,
              workflow_ref: process.env.WORKFLOW_REF,
              actor: context.actor,
              triggering_actor: process.env.TRIGGERING_ACTOR,
              pull_request: pr ? {
                number: pr.number,
                head_sha: pr.head.sha,
                base_sha: pr.base.sha,
                head_repository_id: String(pr.head.repo.id),
                base_repository_id: String(pr.base.repo.id),
              } : null,
            };
            const encoded = JSON.stringify(receipt);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-source.json', encoded);
            core.notice(encoded, {title: 'runner-source-v1'});
      - name: Retain original source receipt
        uses: actions/upload-artifact@v4
        with:
          name: runner-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-source.json
          if-no-files-found: error
          retention-days: 14

  probe:
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')[inputs.platform || 'macos-26'] || inputs.platform || 'macos-26' }}
    timeout-minutes: 5
    steps:
      - name: Verify selected runner
        uses: actions/github-script@v7
        env:
          EXPECTED_PLATFORM: ${{ inputs.platform || 'macos-26' }}
          EXPECTED_ENVIRONMENT: ${{ inputs.expected_environment || 'any' }}
          RUNNER_ENVIRONMENT: ${{ runner.environment }}
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const os = require('os');
            const fs = require('fs');
            const expected = {
              'macos-26': ['darwin', 'arm64'],
              'ubuntu-24.04': ['linux', 'x64'],
              'windows-latest': ['win32', 'x64'],
            }[process.env.EXPECTED_PLATFORM];
            const receipt = {
              schema: 1,
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: String(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              sha: context.sha,
              ref: context.ref,
              workflow_sha: process.env.WORKFLOW_SHA,
              workflow_ref: process.env.WORKFLOW_REF,
              actor: context.actor,
              triggering_actor: process.env.TRIGGERING_ACTOR,
              environment: process.env.RUNNER_ENVIRONMENT,
              platform: os.platform(),
              architecture: os.arch(),
              release: os.release(),
            };
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-routing-canary.json', JSON.stringify(receipt));
            core.info(JSON.stringify(receipt));
            if (!expected || receipt.platform !== expected[0] || receipt.architecture !== expected[1]) {
              core.setFailed('Runner operating system or architecture differs from the requested platform');
            }
            if (process.env.EXPECTED_ENVIRONMENT !== 'any' && receipt.environment !== process.env.EXPECTED_ENVIRONMENT) {
              core.setFailed('Runner environment differs from the expected hosted/local route');
            }
      - name: Retain routing observation
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runner-routing-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-routing-canary.json
          if-no-files-found: error
          retention-days: 14
      - name: Exercise an explicit canary rerun
        if: inputs.fail_first_attempt && github.run_attempt == 1
        uses: actions/github-script@v7
        with:
          script: core.setFailed('Controlled canary failure; no build or deployment was executed');
