name: Performance evidence and documentation

on:
  push:
    branches: [lustr/performance-evidence-20261117]
    paths:
      - 'tools/performance_report.py'
      - 'tools/test_performance_report.py'
      - 'docs/performance/campaigns.json'
      - '.github/workflows/performance-documentation.yml'
  pull_request:
    paths:
      - 'tools/performance_report.py'
      - 'tools/test_performance_report.py'
      - 'docs/performance/**'
      - '.github/workflows/performance-documentation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  replay:
    if: github.event_name != 'push'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Test evidence validation and independent statistics
        run: python3 tools/test_performance_report.py
      - name: Replay committed data and reject stale documentation
        run: python3 tools/performance_report.py replay --root docs/performance --check

  import-pinned-evidence:
    if: github.event_name == 'push' && github.repository == 'glopyglerky/lustr' && github.ref == 'refs/heads/lustr/performance-evidence-20261117'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Test evidence validation and independent statistics
        run: python3 tools/test_performance_report.py
      - name: Import only pinned completed run artifacts and independently replay their results
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/performance_report.py fetch --root docs/performance
      - name: Verify generated results offline
        run: python3 tools/performance_report.py replay --root docs/performance --check
      - name: Preserve generated documentation on this review branch only
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch='lustr/performance-evidence-20261117'
          test "$GITHUB_REF" = "refs/heads/$branch"
          actual=$(git ls-remote --heads origin "refs/heads/$branch" | cut -f1)
          test "$actual" = "$EXPECTED_HEAD"
          git add -- README.md docs/performance
          git diff --cached --name-only | while IFS= read -r path; do
            case "$path" in README.md|docs/performance/*) ;; *) exit 1 ;; esac
          done
          if ! git diff --cached --quiet; then
            git -c user.name='Lustr performance documentation' -c user.email='performance@users.noreply.github.com' commit -m 'Record independently replayed Lust/Lustr/rustc measurements and raw evidence'
            git push origin "HEAD:refs/heads/$branch"
          fi
      - name: Retain generated reports even if branch publication conflicts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verified-performance-documentation-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            docs/performance
            README.md
