name: Compiler set

on:
  push:
    branches: [next]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/compiler_contract.rs'
      - 'compiler/native/**'
      - 'crates/lustr-native-core/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - 'crates/lustr-bench/**'
      - 'upstream/lust.pin'
      - 'upstream/lust.integration'
      - 'upstream/lust-integration.*'
      - 'tools/lust-upstream-check.rs'
      - 'tools/*mixed*'
      - 'tools/*coordinator*'
      - 'tools/*evidence*'
      - 'tools/*upstream-slice*'
      - 'tools/*three-way*'
      - 'tools/build-tinycc-pic.rs'
      - 'tools/apply-tinycc-signing.py'
      - 'tools/test-tinycc-signing.py'
      - 'tools/package-qualification-records.py'
      - 'tools/test-qualification-records.py'
      - 'upstream/tinycc-macho-signing.*'
      - 'tools/build-native-toolchain.rs'
      - 'tools/selection-toolchain-receipt.rs'
      - 'tools/check-exclusive-coverage.py'
      - 'tools/test-exclusive-entry.py'
      - 'tools/test-exclusive-coverage-guard.py'
      - 'tools/test-native-build-policy.py'
      - 'tools/qualify-capability-results.py'
      - 'tools/test-capability-results.py'
      - 'tools/qualify-retained-results.py'
      - 'tools/test-retained-results.py'
      - 'upstream/retained-scenario-results.json'
      - 'upstream/complement-imports.json'
      - 'tools/native-target-layout-qualification.rs'
      - 'tools/profile-native-preflight.rs'
      - 'tools/run-warm-entry-comparison.py'
      - 'tools/test-native-selection-cache.py'
      - 'tools/test-native-selection-seed.py'
      - 'tools/test-native-compact-selection.py'
      - 'tools/test-native-cargo-plan.py'
      - 'tools/check-warm-applicability.py'
      - 'tools/test-warm-applicability.py'
      - 'tools/qualify-shared-upstream.py'
      - 'tools/test-native-upstream.py'
      - 'tools/test-native-import-emission.py'
      - 'tools/native-upstream-qualification.rs'
      - 'tests/shared-imports/**'
      - '.github/workflows/compiler-set.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/compiler_contract.rs'
      - 'compiler/native/**'
      - 'crates/lustr-native-core/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - 'crates/lustr-bench/**'
      - 'upstream/lust.pin'
      - 'upstream/lust.integration'
      - 'upstream/lust-integration.*'
      - 'tools/lust-upstream-check.rs'
      - 'tools/*mixed*'
      - 'tools/*coordinator*'
      - 'tools/*evidence*'
      - 'tools/*upstream-slice*'
      - 'tools/*three-way*'
      - 'tools/build-tinycc-pic.rs'
      - 'tools/apply-tinycc-signing.py'
      - 'tools/test-tinycc-signing.py'
      - 'tools/package-qualification-records.py'
      - 'tools/test-qualification-records.py'
      - 'upstream/tinycc-macho-signing.*'
      - 'tools/build-native-toolchain.rs'
      - 'tools/selection-toolchain-receipt.rs'
      - 'tools/check-exclusive-coverage.py'
      - 'tools/test-exclusive-entry.py'
      - 'tools/test-exclusive-coverage-guard.py'
      - 'tools/test-native-build-policy.py'
      - 'tools/qualify-capability-results.py'
      - 'tools/test-capability-results.py'
      - 'tools/qualify-retained-results.py'
      - 'tools/test-retained-results.py'
      - 'upstream/retained-scenario-results.json'
      - 'upstream/complement-imports.json'
      - 'tools/native-target-layout-qualification.rs'
      - 'tools/profile-native-preflight.rs'
      - 'tools/run-warm-entry-comparison.py'
      - 'tools/test-native-selection-cache.py'
      - 'tools/test-native-selection-seed.py'
      - 'tools/test-native-compact-selection.py'
      - 'tools/test-native-cargo-plan.py'
      - 'tools/check-warm-applicability.py'
      - 'tools/test-warm-applicability.py'
      - 'tools/qualify-shared-upstream.py'
      - 'tools/test-native-upstream.py'
      - 'tools/test-native-import-emission.py'
      - 'tools/native-upstream-qualification.rs'
      - 'tests/shared-imports/**'
      - '.github/workflows/compiler-set.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-source:
    name: Runner source provenance
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Record original workflow and source
        uses: actions/github-script@v7
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const receipt = {
              schema: 1,
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: String(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event_name: context.eventName,
              sha: context.sha,
              ref: context.ref,
              workflow_sha: process.env.WORKFLOW_SHA,
              workflow_ref: process.env.WORKFLOW_REF,
              actor: context.actor,
              triggering_actor: process.env.TRIGGERING_ACTOR,
              pull_request: pr ? {
                number: pr.number,
                head_sha: pr.head.sha,
                base_sha: pr.base.sha,
                head_repository_id: String(pr.head.repo.id),
                base_repository_id: String(pr.base.repo.id),
              } : null,
            };
            const encoded = JSON.stringify(receipt);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-source.json', encoded);
            core.notice(encoded, {title: 'runner-source-v1'});
      - name: Retain original source receipt
        uses: actions/upload-artifact@v4
        with:
          name: runner-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-source.json
          if-no-files-found: error
          retention-days: 14

  upstream-lust:
    name: Pinned Lust reference and declared integration
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the exact pristine reference objects
        uses: actions/checkout@v4
        with:
          repository: t3dotgg/lust-lang
          ref: 240e08d91d4aed0299639f6f11fd522912b248f9
          path: .lust-pristine-reference
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Check exact candidate source identity (release admission is separate)
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/.lust-pristine-reference/.git/objects
        run: |
          rustc +1.99.1 --edition=2024 tools/lust-upstream-check.rs -o "$RUNNER_TEMP/lust-upstream-check"
          "$RUNNER_TEMP/lust-upstream-check" --candidate
      - name: Verify exact integration and reject unexpected drift
        run: |
          rustc +1.99.1 --edition=2024 --test tools/lust-upstream-check.rs -o "$RUNNER_TEMP/lust-upstream-check-tests"
          "$RUNNER_TEMP/lust-upstream-check-tests"

  semantic:
    name: Checked rustc semantic inspection
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler development libraries
        run: rustup toolchain install nightly-2026-11-05 --profile minimal --component rustc-dev --component rust-src --component llvm-tools --component rustfmt
      - name: Format check
        run: cargo +nightly-2026-11-05 fmt --manifest-path crates/lustr-semantic/Cargo.toml -- --check
      - name: Build pinned inspection tool
        run: cargo +nightly-2026-11-05 build --manifest-path crates/lustr-semantic/Cargo.toml --locked --offline
      - name: Verify actual compiler semantics and artifact interoperability
        run: python3 crates/lustr-semantic/tests/test_probe.py -v

  native-entry-and-services:
    name: Exclusive native entry and shared-service research
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-09
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Enforce structural ownership and declared partial imports
        run: |
          python3 tools/check-exclusive-coverage.py
          python3 tools/test-exclusive-coverage-guard.py
      - name: Require complete-replacement release refusal
        run: |
          set +e
          python3 tools/check-exclusive-coverage.py --release > "$RUNNER_TEMP/release-refusal.json"
          status=$?
          set -e
          test "$status" -eq 1
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); assert not r["full_rust_coverage"] and r["release_status"] == "unavailable"' "$RUNNER_TEMP/release-refusal.json"
      - name: Obtain the exact pristine reference objects
        uses: actions/checkout@v4
        with:
          repository: t3dotgg/lust-lang
          ref: 240e08d91d4aed0299639f6f11fd522912b248f9
          path: .lust-pristine-reference
          persist-credentials: false
      - name: Install the declared build SDK and research oracle
        run: rustup toolchain install nightly-2026-11-09 --profile minimal --component rustc-dev --component llvm-tools
      - name: Install the native planning process observer
        run: |
          if ! command -v strace >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y strace
          fi
      - name: Reject product and research feature unification before compiler work
        run: python3 tools/test-native-build-policy.py --rustc "$(rustup which rustc)" --output "$RUNNER_TEMP/native-build-policy.json"
      - name: Obtain the pinned TinyCC source
        uses: actions/checkout@v4
        with:
          repository: TinyCC/tinycc
          ref: 43c7708b85681a2fd4451c8a541af4494a8919b2
          path: .tinycc-pristine-reference
          persist-credentials: false
      - name: Build the native TinyCC dependency
        run: |
          rustc --edition=2024 tools/build-tinycc-pic.rs -o "$RUNNER_TEMP/build-tinycc-pic"
          "$RUNNER_TEMP/build-tinycc-pic" "$GITHUB_WORKSPACE/.tinycc-pristine-reference" "$RUNNER_TEMP/lustr-tinycc"
      - name: Qualify TinyCC signing arguments and native publication
        run: |
          python3 tools/test-tinycc-signing.py \
            --source "$RUNNER_TEMP/lustr-tinycc/source" \
            --tcc "$RUNNER_TEMP/lustr-tinycc/install" \
            --output "$RUNNER_TEMP/tinycc-signing-qualification"
      - name: Prepare the declared locked dependencies
        run: |
          cargo fetch --manifest-path compiler/native/Cargo.toml --locked
          cargo fetch --manifest-path crates/lustr-native-core/Cargo.toml --locked
          cargo fetch --manifest-path Cargo.toml --locked
      - name: Build the partial debug native compiler without a packaged Rust compiler
        id: native_build
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/.lust-pristine-reference/.git/objects
        run: |
          rustc --edition=2024 tools/build-native-toolchain.rs -o "$RUNNER_TEMP/build-native-toolchain"
          "$RUNNER_TEMP/build-native-toolchain" "$GITHUB_WORKSPACE" --current-sdk "$RUNNER_TEMP/lustr-tinycc/install" "$RUNNER_TEMP/lustr-native-built" --debug
      - name: Require product bridge ownership and one retained compilation attempt
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        env:
          LUST_TCC_HOME: ${{ runner.temp }}/lustr-tinycc/install
          RUST_MIN_STACK: '268435456'
        run: |
          set -o pipefail
          export RUSTC="$(rustup which rustc)"
          native_work="$RUNNER_TEMP/lustr-native-built/work"
          for test_filter in mixed_admission product_daemon product_cargo_plan cargo_target_selector_fact driver::buildscript::native::tests resolve::cfg::tests; do
            log_name="${test_filter//:/_}"
            env -u LD_LIBRARY_PATH "$(rustup which cargo)" test --manifest-path compiler/native/Cargo.toml --locked --offline --jobs 2 --features exclusive-native --bin lust-core --target-dir "$native_work/native-target" --config "build.build-dir=\"$native_work/native-intermediates\"" "$test_filter" -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/lustr-native-built/logs/$log_name-tests.log"
          done
      - name: Require native execution, exclusive routing and terminal failures
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          python3 tools/test-exclusive-entry.py --entry "$RUNNER_TEMP/lustr-native-built/toolchain/bin/lustr" --native-runtime "$RUNNER_TEMP/lustr-native-built/toolchain" --require-daemon --output "$RUNNER_TEMP/exclusive-entry.json"
          test -f "$RUNNER_TEMP/lustr-native-built/toolchain/PARTIAL-NATIVE-COMPILER"
          test ! -e "$RUNNER_TEMP/lustr-native-built/toolchain/bin/rustc-full"
          test ! -e "$RUNNER_TEMP/lustr-native-built/toolchain/bin/rustc-reference"
      - name: Run all public crate targets and real-package contracts
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        env:
          LUSTR_LUST_ROOT: ${{ runner.temp }}/lustr-native-built/toolchain
          LUSTR_NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/lustr-native-built/NATIVE-BUILD-RECEIPT.txt
          LUSTR_TEST_PACKAGE: ${{ runner.temp }}/lustr-native-built/toolchain
          LUSTR_TEST_OUTPUT: ${{ runner.temp }}/lustr-root-package-controls
          RUST_MIN_STACK: '268435456'
        run: |
          set -euo pipefail
          export RUSTC="$(rustup which rustc)"
          export LUSTR_CORE_ROOT="$(rustc --print sysroot)"
          export LUSTR_TEST_ORACLE="$RUSTC"
          native_work="$RUNNER_TEMP/lustr-native-built/work"
          cargo test --manifest-path Cargo.toml --features source-native-runtime --all-targets --locked --offline --jobs 2 --target-dir "$native_work/entry-target" --config "build.build-dir=\"$native_work/entry-intermediates\"" -- --test-threads=1 2>&1 | tee "$RUNNER_TEMP/lustr-native-built/logs/root-all-target-tests.log"
          # The five installed-package controls are intentionally ignored by
          # ordinary unit runs. Execute them explicitly on this socket host.
          # Do not include the unit-test process used as a signal fixture.
          cargo test --manifest-path Cargo.toml --features source-native-runtime --test compiler_contract --locked --offline --jobs 2 --target-dir "$native_work/entry-target" --config "build.build-dir=\"$native_work/entry-intermediates\"" -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/lustr-native-built/logs/root-package-contract-tests.log"
      - name: Require exact native Cargo planning and warm process reuse
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          python3 tools/test-native-cargo-plan.py \
            --source "$GITHUB_WORKSPACE" \
            --package "$RUNNER_TEMP/lustr-native-built/toolchain" \
            --sdk "$(rustc --print sysroot)" \
            --output "$RUNNER_TEMP/native-cargo-plan"
      - name: Check declared upstream capabilities against the constructed native compiler
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          set -o pipefail
          native="$RUNNER_TEMP/lustr-native-built/toolchain/bin/lust"
          "$native" capabilities --json > "$RUNNER_TEMP/lustr-native-built/logs/capabilities.json"
          sha256sum "$native" "$RUNNER_TEMP/lustr-native-built/toolchain/bin/lust-core" compiler/native/scripts/test-capabilities.py > "$RUNNER_TEMP/lustr-native-built/logs/capability-inputs.sha256"
          python3 compiler/native/scripts/test-capabilities.py "$native" 2>&1 | tee "$RUNNER_TEMP/lustr-native-built/logs/capability-probes.log"
          cat >> "$GITHUB_STEP_SUMMARY" <<'MARKDOWN'
          Capability probes check the pinned upstream declarations in eight
          sections with the script's explicit unprobed exceptions. They run
          only in qualification, never as request routing or trial compilation.
          This functional debug-package gate does not prove all Rust coverage,
          contextual support beyond its probes, or matched compilation speed.
          MARKDOWN
      - name: Compare supported capability outputs through the public compiler
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/test-capability-results.py -v
          python3 tools/qualify-capability-results.py \
            --entry "$RUNNER_TEMP/lustr-native-built/toolchain/bin/lustr" \
            --rustc "$(rustup which rustc)" \
            --output "$RUNNER_TEMP/capability-results"
      - name: Compare pinned retained histories through the public compiler
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        run: |
          set -euo pipefail
          python3 tools/test-retained-results.py -v \
            --oracle-rustc "$(rustup which rustc)" \
            --oracle-cargo "$(rustup which cargo)" \
            --oracle-output "$RUNNER_TEMP/retained-oracle-controls"
          python3 tools/qualify-retained-results.py \
            --entry "$RUNNER_TEMP/lustr-native-built/toolchain/bin/lustr" \
            --rustc "$(rustup which rustc)" \
            --cargo "$(rustup which cargo)" \
            --jobs 2 --output "$RUNNER_TEMP/retained-results"
      - name: Build the actual native target-selector diagnostic
        id: selector_build
        if: ${{ !cancelled() && steps.native_build.outcome == 'success' }}
        env:
          LUSTR_LUST_ROOT: ${{ runner.temp }}/lustr-native-built/toolchain
          LUSTR_NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/lustr-native-built/NATIVE-BUILD-RECEIPT.txt
        run: |
          export RUSTC="$(rustup which rustc)"
          export LUSTR_CORE_ROOT="$(rustc --print sysroot)"
          cargo build --example profile-native-preflight --features source-native-runtime --locked --offline --jobs 2 --target-dir "$RUNNER_TEMP/lustr-native-built/work/entry-target" --config "build.build-dir=\"$RUNNER_TEMP/lustr-native-built/work/entry-intermediates\""
      - name: Require native Cargo selection reuse and invalidation
        if: ${{ !cancelled() && steps.selector_build.outcome == 'success' }}
        run: |
          python3 tools/test-native-selection-cache.py --profiler "$RUNNER_TEMP/lustr-native-built/work/entry-target/debug/examples/profile-native-preflight" --package-bin "$RUNNER_TEMP/lustr-native-built/toolchain/bin" --output "$RUNNER_TEMP/native-selection-cache"
          python3 tools/test-native-selection-seed.py --profiler "$RUNNER_TEMP/lustr-native-built/work/entry-target/debug/examples/profile-native-preflight" --package-bin "$RUNNER_TEMP/lustr-native-built/toolchain/bin" --output "$RUNNER_TEMP/native-selection-seed"
          python3 tools/test-native-compact-selection.py --profiler "$RUNNER_TEMP/lustr-native-built/work/entry-target/debug/examples/profile-native-preflight" --package-bin "$RUNNER_TEMP/lustr-native-built/toolchain/bin" --output "$RUNNER_TEMP/native-compact-selection"
      - name: Preserve real symbol and ABI component controls
        if: ${{ !cancelled() }}
        run: |
          python3 tools/test-mixed-symbols.py --tcc "$RUNNER_TEMP/lustr-tinycc/install/bin/tcc"
          python3 tools/test-mixed-symbol-rename.py --tcc "$RUNNER_TEMP/lustr-tinycc/install/bin/tcc"
      - name: Qualify genuine provider definitions and native consumer semantics
        if: ${{ !cancelled() }}
        run: |
          python3 tools/qualify-shared-upstream.py --cargo "$(rustup which cargo)" --rustc "$(rustup which rustc)" --tcc "$RUNNER_TEMP/lustr-tinycc/install" --output "$RUNNER_TEMP/lustr-shared-upstream"
      - name: Qualify owned imported emission and failure preservation
        if: ${{ !cancelled() }}
        run: |
          python3 tools/qualify-shared-upstream.py --cargo "$(rustup which cargo)" --rustc "$(rustup which rustc)" --tcc "$RUNNER_TEMP/lustr-tinycc/install" --output "$RUNNER_TEMP/lustr-import-emission" --emission-only
      - name: Exercise supplemental qualification record packaging
        if: always()
        run: python3 tools/test-qualification-records.py -v
      - name: Package supplemental qualification records
        if: always()
        run: |
          python3 tools/package-qualification-records.py \
            --root "$RUNNER_TEMP" --output "$RUNNER_TEMP/lustr-qualification-records"
      - name: Retain supplemental qualification records
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-qualification-records
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lustr-qualification-records/inventory.json
            ${{ runner.temp }}/lustr-qualification-records/records.tar.gz
      - name: Retain source-bound results and every failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exclusive-entry-and-shared-services
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/release-refusal.json
            ${{ runner.temp }}/native-build-policy.json
            ${{ runner.temp }}/exclusive-entry.json
            ${{ runner.temp }}/native-selection-cache
            ${{ runner.temp }}/native-selection-seed
            ${{ runner.temp }}/native-compact-selection
            ${{ runner.temp }}/native-cargo-plan
            ${{ runner.temp }}/tinycc-signing-qualification
            ${{ runner.temp }}/lustr-tinycc/logs
            ${{ runner.temp }}/lustr-tinycc/COMPONENTS.txt
            ${{ runner.temp }}/lustr-native-built/COMPONENTS.txt
            ${{ runner.temp }}/lustr-native-built/logs
            ${{ runner.temp }}/lustr-root-package-controls
            ${{ runner.temp }}/retained-results
            ${{ runner.temp }}/retained-oracle-controls
            ${{ runner.temp }}/capability-results/report.json
            ${{ runner.temp }}/capability-results/*.stdout
            ${{ runner.temp }}/capability-results/*.stderr
            ${{ runner.temp }}/lustr-shared-upstream/verification.json
            ${{ runner.temp }}/lustr-shared-upstream/*.stdout
            ${{ runner.temp }}/lustr-shared-upstream/*.stderr
            ${{ runner.temp }}/lustr-shared-upstream/campaign
            ${{ runner.temp }}/lustr-import-emission/verification.json
            ${{ runner.temp }}/lustr-import-emission/*.stdout
            ${{ runner.temp }}/lustr-import-emission/*.stderr
            ${{ runner.temp }}/lustr-import-emission/campaign

  compatibility:
    name: Retained Cargo planning helpers (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-26, windows-latest]
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')[matrix.os] || matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal --component rustfmt
      - name: Format check
        run: cargo +1.99.1 fmt --manifest-path crates/lustr/Cargo.toml -- --check
      - name: Check paired statistical methods
        run: python3 -m unittest discover -s crates/lustr/bench -p "test_*.py" -v
      - name: Test every retained planning, retired entry and reference contract
        run: cargo +1.99.1 test --manifest-path crates/lustr/Cargo.toml --locked --offline

  minimum-rust:
    name: Planning helpers minimum Rust
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install minimum supported Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Build and test on minimum Rust
        run: cargo +1.85.0 test --manifest-path crates/lustr/Cargo.toml --locked --offline
