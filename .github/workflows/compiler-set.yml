name: Compiler set

on:
  push:
    branches: [next]
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/compiler_contract.rs'
      - 'compiler/native/**'
      - 'crates/lustr-native-core/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - 'crates/lustr-bench/**'
      - 'upstream/lust.pin'
      - 'upstream/lust.integration'
      - 'upstream/lust-integration.*'
      - 'tools/lust-upstream-check.rs'
      - 'tools/*mixed*'
      - 'tools/*coordinator*'
      - 'tools/*evidence*'
      - 'tools/*upstream-slice*'
      - 'tools/build-tinycc-pic.rs'
      - 'tools/native-target-layout-qualification.rs'
      - '.github/workflows/compiler-set.yml'
  pull_request:
    paths:
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'build.rs'
      - 'src/**'
      - 'tests/compiler_contract.rs'
      - 'compiler/native/**'
      - 'crates/lustr-native-core/**'
      - 'crates/lustr/**'
      - 'crates/lustr-semantic/**'
      - 'crates/lustr-bench/**'
      - 'upstream/lust.pin'
      - 'upstream/lust.integration'
      - 'upstream/lust-integration.*'
      - 'tools/lust-upstream-check.rs'
      - 'tools/*mixed*'
      - 'tools/*coordinator*'
      - 'tools/*evidence*'
      - 'tools/*upstream-slice*'
      - 'tools/build-tinycc-pic.rs'
      - 'tools/native-target-layout-qualification.rs'
      - '.github/workflows/compiler-set.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  runner-source:
    name: Runner source provenance
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 5
    steps:
      - name: Record original workflow and source
        uses: actions/github-script@v7
        env:
          WORKFLOW_SHA: ${{ github.workflow_sha }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          TRIGGERING_ACTOR: ${{ github.triggering_actor }}
        with:
          script: |
            const fs = require('fs');
            const pr = context.payload.pull_request;
            const receipt = {
              schema: 1,
              repository: context.repo.owner + '/' + context.repo.repo,
              run_id: String(context.runId),
              run_attempt: Number(process.env.GITHUB_RUN_ATTEMPT),
              event_name: context.eventName,
              sha: context.sha,
              ref: context.ref,
              workflow_sha: process.env.WORKFLOW_SHA,
              workflow_ref: process.env.WORKFLOW_REF,
              actor: context.actor,
              triggering_actor: process.env.TRIGGERING_ACTOR,
              pull_request: pr ? {
                number: pr.number,
                head_sha: pr.head.sha,
                base_sha: pr.base.sha,
                head_repository_id: String(pr.head.repo.id),
                base_repository_id: String(pr.base.repo.id),
              } : null,
            };
            const encoded = JSON.stringify(receipt);
            fs.writeFileSync(process.env.RUNNER_TEMP + '/runner-source.json', encoded);
            core.notice(encoded, {title: 'runner-source-v1'});
      - name: Retain original source receipt
        uses: actions/upload-artifact@v4
        with:
          name: runner-source-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/runner-source.json
          if-no-files-found: error
          retention-days: 14

  upstream-lust:
    name: Pinned Lust reference and declared integration
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Obtain the exact pristine reference objects
        uses: actions/checkout@v4
        with:
          repository: t3dotgg/lust-lang
          ref: 240e08d91d4aed0299639f6f11fd522912b248f9
          path: .lust-pristine-reference
          persist-credentials: false
      - name: Install Rust
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: Check exact candidate source identity (release admission is separate)
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ github.workspace }}/.lust-pristine-reference/.git/objects
        run: |
          rustc +1.99.1 --edition=2024 tools/lust-upstream-check.rs -o "$RUNNER_TEMP/lust-upstream-check"
          "$RUNNER_TEMP/lust-upstream-check" --candidate
      - name: Verify exact integration and reject unexpected drift
        run: |
          rustc +1.99.1 --edition=2024 --test tools/lust-upstream-check.rs -o "$RUNNER_TEMP/lust-upstream-check-tests"
          "$RUNNER_TEMP/lust-upstream-check-tests"

  semantic:
    name: Checked rustc semantic inspection
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install pinned compiler development libraries
        run: rustup toolchain install nightly-2026-11-05 --profile minimal --component rustc-dev --component rust-src --component llvm-tools --component rustfmt
      - name: Format check
        run: cargo +nightly-2026-11-05 fmt --manifest-path crates/lustr-semantic/Cargo.toml -- --check
      - name: Build pinned inspection tool
        run: cargo +nightly-2026-11-05 build --manifest-path crates/lustr-semantic/Cargo.toml --locked --offline
      - name: Verify actual compiler semantics and artifact interoperability
        run: python3 crates/lustr-semantic/tests/test_probe.py -v

  mixed-source-build:
    name: Source-built mixed Rust and Lust
    runs-on: ${{ ((github.event_name != 'pull_request' && github.event_name != 'pull_request_target') || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON(vars.CI_RUNNER_ROUTES || '{}')['ubuntu-24.04'] || 'ubuntu-24.04' }}
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-11-09
      CARGO_BUILD_JOBS: '2'
    steps:
      - uses: actions/checkout@v4
      - name: Validate qualification workflow controls before compiler builds
        run: |
          python3 tools/test-mixed-workflow.py
          rustc +stable --edition=2024 --test crates/lustr-semantic/src/mixed_entry.rs -o "$RUNNER_TEMP/lustr-mixed-entry-tests"
          "$RUNNER_TEMP/lustr-mixed-entry-tests"
          python3 tools/test-encrypted-evidence.py
          python3 tools/test-mixed-profile.py
          python3 tools/test-mixed-performance-report.py
          python3 tools/test-mixed-symbol-measurement.py
          python3 tools/test-upstream-slice-benchmark.py
      - name: Obtain the exact pristine reference objects
        uses: actions/checkout@v4
        with:
          repository: t3dotgg/lust-lang
          ref: 240e08d91d4aed0299639f6f11fd522912b248f9
          path: .lust-pristine-reference
          persist-credentials: false
      - name: Obtain the unchanged cache-regression baseline
        uses: actions/checkout@v4
        with:
          repository: glopyglerky/lustr
          ref: 2add988c6397ac5175fcdf89a3aac17d359bf283
          path: .regression-baseline
          persist-credentials: false
      - name: Isolate unchanged comparison sources from the product workspace
        run: |
          cp -a "$GITHUB_WORKSPACE/.regression-baseline" "$RUNNER_TEMP/lustr-regression-source"
          cp -a "$GITHUB_WORKSPACE/.lust-pristine-reference" "$RUNNER_TEMP/lustr-pristine-source"
      - name: Install matching complete Rust development libraries
        run: rustup toolchain install nightly-2026-11-09 --profile minimal --component rustc-dev --component llvm-tools --component rustfmt --component clippy --target wasm32-unknown-unknown --target x86_64-apple-darwin --target aarch64-apple-darwin --target x86_64-pc-windows-gnu
      - name: Verify complete trace records under concurrent compiler processes
        env:
          RUSTUP_TOOLCHAIN: nightly-2026-11-09
        run: |
          set -o pipefail
          python3 tools/test-mixed-trace.py 2>&1 | tee "$RUNNER_TEMP/mixed-trace-tests.log"
      - name: Install WebAssembly execution oracle
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Obtain the pinned TinyCC source
        uses: actions/checkout@v4
        with:
          repository: TinyCC/tinycc
          ref: 43c7708b85681a2fd4451c8a541af4494a8919b2
          path: .tinycc-pristine-reference
          persist-credentials: false
      - name: Build TinyCC constructor
        run: rustc --edition=2024 tools/build-tinycc-pic.rs -o "$RUNNER_TEMP/build-tinycc-pic"
      - name: Build upstream TinyCC with shared-library relocations
        run: '"$RUNNER_TEMP/build-tinycc-pic" "$GITHUB_WORKSPACE/.tinycc-pristine-reference" "$RUNNER_TEMP/lustr-tinycc"'
      - name: Verify in-process mixed object checks against actual TinyCC and GNU nm
        run: |
          python3 tools/test-mixed-symbols.py --tcc "$RUNNER_TEMP/lustr-tinycc/install/bin/tcc"
          python3 tools/test-mixed-symbol-rename.py --tcc "$RUNNER_TEMP/lustr-tinycc/install/bin/tcc"
      - name: Prepare locked dependencies for offline source builds
        run: |
          cargo fetch --manifest-path compiler/native/Cargo.toml --locked
          cargo fetch --manifest-path crates/lustr-native-core/Cargo.toml --locked
          cargo fetch --manifest-path crates/lustr/Cargo.toml --locked
          cargo fetch --manifest-path crates/lustr-semantic/Cargo.toml --locked
          cargo fetch --manifest-path Cargo.toml --locked
      - name: Build source toolchain constructor
        run: rustc --edition=2024 tools/build-mixed-toolchain.rs -o "$RUNNER_TEMP/build-mixed-toolchain"
      - name: Record the exact checked-out source
        run: git rev-parse HEAD 'HEAD^{tree}' > "$RUNNER_TEMP/lustr-source-revision.txt"
      - name: Build optimized local toolchain without a predecessor package
        id: source_toolchain
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ runner.temp }}/lustr-pristine-source/.git/objects
        run: '"$RUNNER_TEMP/build-mixed-toolchain" "$GITHUB_WORKSPACE" --current-sdk "$RUNNER_TEMP/lustr-tinycc/install" "$RUNNER_TEMP/lustr-source-built" --release'
      # Continue independent suites after a failure, without masking that failure.
      # Measurements still require every correctness prerequisite to pass.
      - name: Build real mixed-project qualifier
        id: mixed_qualifier
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: rustc --edition=2024 tools/mixed-compiler-qualification.rs -o "$RUNNER_TEMP/mixed-compiler-qualification"
      - name: Build native target-layout qualification
        id: layout_qualifier
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: rustc --edition=2024 tools/native-target-layout-qualification.rs -o "$RUNNER_TEMP/native-target-layout-qualification"
      - name: Compare selected native frontend layouts with the matching Rust target metadata
        id: target_layout
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.layout_qualifier.outcome == 'success' }}
        run: '"$RUNNER_TEMP/native-target-layout-qualification" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lust" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/rustc-reference" "$RUNNER_TEMP/native-target-layouts" x86_64-unknown-linux-gnu x86_64-apple-darwin aarch64-apple-darwin x86_64-pc-windows-gnu'
      - name: Build the unchanged baseline for the failed-link regression
        id: baseline_toolchain
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        env:
          GIT_ALTERNATE_OBJECT_DIRECTORIES: ${{ runner.temp }}/lustr-pristine-source/.git/objects
        run: '"$RUNNER_TEMP/build-mixed-toolchain" "$RUNNER_TEMP/lustr-regression-source" --current-sdk "$RUNNER_TEMP/lustr-tinycc/install" "$RUNNER_TEMP/lustr-regression-baseline" --release'
      - name: Require the specific failed-link stale-output regression on the baseline
        id: baseline_regression
        if: ${{ !cancelled() && steps.baseline_toolchain.outcome == 'success' && steps.mixed_qualifier.outcome == 'success' }}
        run: |
          set +e
          "$RUNNER_TEMP/mixed-compiler-qualification" "$RUNNER_TEMP/baseline-mixed-project" "$RUNNER_TEMP/lustr-regression-baseline/toolchain/bin/cargo" "$RUNNER_TEMP/lustr-regression-baseline/toolchain/bin/lustr" > "$RUNNER_TEMP/baseline-regression.stdout" 2> "$RUNNER_TEMP/baseline-regression.stderr"
          regression_status=$?
          set -e
          printf '%s\n' "$regression_status" > "$RUNNER_TEMP/baseline-regression.status"
          cat "$RUNNER_TEMP/baseline-regression.stdout" "$RUNNER_TEMP/baseline-regression.stderr"
          test "$regression_status" -ne 0
          grep -F -- 'link-failure-recovery: wrong application result' "$RUNNER_TEMP/baseline-regression.stderr"
      - name: Execute mixed Cargo graph, edits, invalidation, warnings and rejection
        id: mixed_execution
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.mixed_qualifier.outcome == 'success' }}
        run: '"$RUNNER_TEMP/mixed-compiler-qualification" "$RUNNER_TEMP/mixed-project" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/cargo" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lustr"'
      - name: Verify unchanged native objects after complete Rust analysis
        id: native_reuse
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: |
          set -o pipefail
          python3 tools/mixed-native-reuse-qualification.py "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lustr" "$RUNNER_TEMP/lustr-mixed-native-reuse" 2>&1 | tee "$RUNNER_TEMP/lustr-mixed-native-reuse.log"
      - name: Build retained Cargo check qualifier
        id: check_qualifier
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: rustc --edition=2024 tools/mixed-check-qualification.rs -o "$RUNNER_TEMP/mixed-check-qualification"
      - name: Verify retained checks and freshly encoded Rust metadata
        id: retained_checks
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.check_qualifier.outcome == 'success' }}
        run: '"$RUNNER_TEMP/mixed-check-qualification" "$RUNNER_TEMP/mixed-check-project" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lustr" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/rustc-reference"'
      - name: Build mixed library and full-language qualification
        id: library_qualifier
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: rustc --edition=2024 tools/mixed-library-qualification.rs -o "$RUNNER_TEMP/mixed-library-qualification"
      - name: Execute mixed libraries with aggregates, references and generic callers
        id: mixed_libraries
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.library_qualifier.outcome == 'success' }}
        run: '"$RUNNER_TEMP/mixed-library-qualification" "$RUNNER_TEMP/mixed-library-project" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lustr" "$RUNNER_TEMP/lustr-source-built/toolchain/bin/rustc-reference"'
      - name: Execute the complete compiler entry and runtime contract
        id: entry_contract
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        env:
          LUSTR_LUST_ROOT: ${{ runner.temp }}/lustr-source-built/toolchain
          LUSTR_NATIVE_BUILD_OUTPUT: ${{ runner.temp }}/lustr-source-built/NATIVE-BUILD-RECEIPT.txt
          LUSTR_TEST_PACKAGE: ${{ runner.temp }}/lustr-source-built/toolchain
          LUSTR_TEST_OUTPUT: ${{ runner.temp }}/full-entry-contract
        run: |
          export LUSTR_CORE_ROOT="$(rustc --print sysroot)"
          export RUSTC="$LUSTR_CORE_ROOT/bin/rustc"
          set -o pipefail
          cargo test --manifest-path Cargo.toml --release --features source-native-runtime --test compiler_contract --locked --offline --jobs 2 --target-dir "$RUNNER_TEMP/lustr-source-built/work/entry-target" --config "build.build-dir=\"$RUNNER_TEMP/lustr-source-built/work/entry-intermediates\"" -- --ignored --test-threads=1 2>&1 | tee "$RUNNER_TEMP/full-entry-contract.log"
      - name: Build matched pristine Lust for the performance comparison
        id: pristine_build
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.target_layout.outcome == 'success' && steps.baseline_regression.outcome == 'success' && steps.mixed_execution.outcome == 'success' && steps.native_reuse.outcome == 'success' && steps.retained_checks.outcome == 'success' && steps.mixed_libraries.outcome == 'success' && steps.entry_contract.outcome == 'success' }}
        env:
          LUST_TCC_HOME: ${{ runner.temp }}/lustr-tinycc/install
        run: |
          set -o pipefail
          export RUSTC="$(rustc --print sysroot)/bin/rustc"
          cargo build --manifest-path "$RUNNER_TEMP/lustr-pristine-source/Cargo.toml" --release --locked --offline --jobs 2 --bin lust --bin lust-core --target-dir "$RUNNER_TEMP/lustr-pristine-target" --config "build.build-dir=\"$RUNNER_TEMP/lustr-pristine-intermediates\"" 2>&1 | tee "$RUNNER_TEMP/lustr-pristine-build.log"
          sha256sum "$RUNNER_TEMP/lustr-pristine-target/release/lust" "$RUNNER_TEMP/lustr-pristine-target/release/lust-core" > "$RUNNER_TEMP/lustr-pristine-binaries.sha256"
      - name: Profile mixed phases in a separate instrumented qualification
        id: mixed_profile
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.mixed_qualifier.outcome == 'success' && steps.target_layout.outcome == 'success' && steps.baseline_regression.outcome == 'success' && steps.mixed_execution.outcome == 'success' && steps.native_reuse.outcome == 'success' && steps.retained_checks.outcome == 'success' && steps.mixed_libraries.outcome == 'success' && steps.entry_contract.outcome == 'success' }}
        run: python3 tools/profile-mixed-compiler.py --qualifier "$RUNNER_TEMP/mixed-compiler-qualification" --cargo "$RUNNER_TEMP/lustr-source-built/toolchain/bin/cargo" --lustr "$RUNNER_TEMP/lustr-source-built/toolchain/bin/lustr" --output "$RUNNER_TEMP/lustr-mixed-profile"
      - name: Record benchmark host facts before timing
        id: host_record
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: |
          python3 tools/test-benchmark-host.py
          python3 tools/capture-benchmark-host.py "$RUNNER_TEMP/lustr-benchmark-host.json"
      - name: Build the paired native and mixed performance runner
        id: bench_build
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: cargo build --manifest-path crates/lustr-bench/Cargo.toml --release --locked --bin lustr-mixed-bench --target-dir "$RUNNER_TEMP/lustr-bench-target"
      - name: Characterize complete supported and mixed work without granting release admission
        id: measurements
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.target_layout.outcome == 'success' && steps.baseline_regression.outcome == 'success' && steps.mixed_execution.outcome == 'success' && steps.native_reuse.outcome == 'success' && steps.retained_checks.outcome == 'success' && steps.mixed_libraries.outcome == 'success' && steps.entry_contract.outcome == 'success' && steps.pristine_build.outcome == 'success' && steps.bench_build.outcome == 'success' && steps.host_record.outcome == 'success' }}
        env:
          LUSTR_BENCH_HOST_RECORD: ${{ runner.temp }}/lustr-benchmark-host.json
        run: '"$RUNNER_TEMP/lustr-bench-target/release/lustr-mixed-bench" "$RUNNER_TEMP/lustr-pristine-source" "$RUNNER_TEMP/lustr-pristine-target/release/lust" "$RUNNER_TEMP/lustr-source-built" "$RUNNER_TEMP/lustr-paired-measurements" 12'
      - name: Measure the public upstream slice against retained Lust and incremental Cargo
        id: slice_measurements
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.target_layout.outcome == 'success' && steps.baseline_regression.outcome == 'success' && steps.mixed_execution.outcome == 'success' && steps.native_reuse.outcome == 'success' && steps.retained_checks.outcome == 'success' && steps.mixed_libraries.outcome == 'success' && steps.entry_contract.outcome == 'success' && steps.pristine_build.outcome == 'success' && steps.host_record.outcome == 'success' }}
        run: |
          python3 tools/run-upstream-slice-benchmark.py \
            --repository "$GITHUB_WORKSPACE" \
            --pristine-source "$RUNNER_TEMP/lustr-pristine-source" \
            --pristine-lust "$RUNNER_TEMP/lustr-pristine-target/release/lust" \
            --pristine-build-log "$RUNNER_TEMP/lustr-pristine-build.log" \
            --built "$RUNNER_TEMP/lustr-source-built" \
            --output "$RUNNER_TEMP/lustr-public-slice" --pairs 12
      - name: Retain public slice commands, source and all measured outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upstream-public-slice-${{ github.run_attempt }}
          if-no-files-found: warn
          path: |
            ${{ runner.temp }}/lustr-public-slice/report.json
            ${{ runner.temp }}/lustr-public-slice/README.md
            ${{ runner.temp }}/lustr-public-slice/raw.jsonl
            ${{ runner.temp }}/lustr-public-slice/samples.csv
            ${{ runner.temp }}/lustr-public-slice/fixture
            ${{ runner.temp }}/lustr-public-slice/commands
            ${{ runner.temp }}/lustr-public-slice/build-receipts
            ${{ runner.temp }}/lustr-public-slice/runtime-oracle.stdout
            ${{ runner.temp }}/lustr-public-slice/rejected.rs
      - name: Build and verify the unchanged-project campaign runner
        id: project_bench_build
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' }}
        run: |
          cargo build --manifest-path crates/lustr-bench/Cargo.toml --release --locked --offline --bin lustr-bench --bin lustr-bench-gate --example replay --target-dir "$RUNNER_TEMP/lustr-bench-target"
          cargo test --manifest-path crates/lustr-bench/Cargo.toml --locked --offline --bin lustr-bench --bin lustr-bench-gate --test native_state --target-dir "$RUNNER_TEMP/lustr-bench-target" -- --test-threads=1
          LUSTR_BENCH_TEST_ROUTED_SDK="$(rustc --print sysroot)" \
          LUSTR_BENCH_TEST_COORDINATOR="$RUNNER_TEMP/lustr-source-built/toolchain/bin/cargo-lustr" \
          LUSTR_BENCH_TEST_OUTPUT="$RUNNER_TEMP/lustr-routed-test-gate" \
          cargo test --manifest-path crates/lustr-bench/Cargo.toml --locked --offline --test routed --target-dir "$RUNNER_TEMP/lustr-bench-target" -- --exact direct_and_legacy_compiler_paths_match_actual_coordinator
          python3 tools/test-coordinator-campaign.py --replay "$RUNNER_TEMP/lustr-bench-target/release/examples/replay"
      - name: Measure the unchanged coordinator under its default development profile
        id: project_measurements
        if: ${{ !cancelled() && steps.source_toolchain.outcome == 'success' && steps.target_layout.outcome == 'success' && steps.baseline_regression.outcome == 'success' && steps.mixed_execution.outcome == 'success' && steps.native_reuse.outcome == 'success' && steps.retained_checks.outcome == 'success' && steps.mixed_libraries.outcome == 'success' && steps.entry_contract.outcome == 'success' && steps.project_bench_build.outcome == 'success' && steps.host_record.outcome == 'success' }}
        run: |
          python3 tools/measure-coordinator-project.py \
            --repository "$GITHUB_WORKSPACE" \
            --toolchain "$RUNNER_TEMP/lustr-source-built/toolchain" \
            --runner "$RUNNER_TEMP/lustr-bench-target/release/lustr-bench" \
            --gate "$RUNNER_TEMP/lustr-bench-target/release/lustr-bench-gate" \
            --replay "$RUNNER_TEMP/lustr-bench-target/release/examples/replay" \
            --output "$RUNNER_TEMP/lustr-coordinator-campaign" --jobs 2
      - name: Encrypt original project evidence after success or failure
        if: always()
        run: |
          python3 tools/encrypt-coordinator-evidence.py \
            --campaign "$RUNNER_TEMP/lustr-coordinator-campaign" \
            --certificate "$GITHUB_WORKSPACE/tools/benchmark-evidence-recipient.pem" \
            --expected-certificate-sha256 69e1167422ba3edfc45139eda5bdcec97d5bebcdf3e764054f3457488aaa5c4f \
            --output "$RUNNER_TEMP/lustr-coordinator-campaign/encrypted"
      - name: Retain encrypted project originals and explicit retention status
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-project-originals-encrypted-${{ github.run_attempt }}
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/lustr-coordinator-campaign/encrypted/private-evidence.tar.gz.cms
            ${{ runner.temp }}/lustr-coordinator-campaign/encrypted/receipt.json
            ${{ runner.temp }}/lustr-coordinator-campaign/encrypted/status.json
      - name: Retain only the sanitized unchanged-project performance export
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coordinator-project-performance-${{ github.run_attempt }}
          if-no-files-found: warn
