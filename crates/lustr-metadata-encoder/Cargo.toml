[package]
name = "lustr-metadata-encoder"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"

[workspace]
resolver = "3"

[dependencies]
md-5 = { version = "=0.10.6", default-features = false }
twox-hash = { version = "=2.1.2", default-features = false, features = ["alloc", "xxhash3_128"] }

[dev-dependencies]
odht = "=0.3.1"
rustc-stable-hash = "=0.1.2"

[profile.release]
opt-level = 3
codegen-units = 1
