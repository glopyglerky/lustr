[package]
name = "lustr-native-metadata-qualification"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
autobins = false

[[bin]]
name = "lustr-native-metadata-qualification"
path = "src/main.rs"
required-features = ["native-qualification"]

[workspace]
resolver = "3"

[features]
default = ["native-qualification"]
native-qualification = []

[dependencies]
lustr-metadata-encoder = { path = "../lustr-metadata-encoder" }
lustr-metadata-sdk = { path = "../lustr-metadata-sdk" }
mimalloc = { version = "=0.1.52", default-features = false }
libmimalloc-sys = { version = "=0.1.49", default-features = false }
unicode-normalization = "=0.1.25"
object = { version = "=0.39.1", default-features = false, features = ["write_std", "read_core", "elf", "archive"] }
serde_json = "=1.0.154"
sha2 = "=0.11.1"
