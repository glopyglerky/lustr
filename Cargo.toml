[package]
name = "lustr-compiler"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT"

[dependencies]
serde_json = "=1.0.154"
sha2 = "=0.11.1"
cargo_lust = { package = "lustr", path = "crates/lustr" }

[features]
native-inference = []
source-native-runtime = []

[workspace]
resolver = "3"
exclude = ["compiler/native", "crates/lustr", "crates/lustr-semantic", "crates/lustr-native-core"]

[[bin]]
name = "lustr"
path = "src/main.rs"

[[bin]]
name = "lustr-native-worker"
path = "src/native_worker.rs"
required-features = ["native-inference"]

[profile.release]
opt-level = 3
codegen-units = 1
lto = "thin"
strip = true
